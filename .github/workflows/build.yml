name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run core tests
        run: node tests/unit/core.test.js
      - name: Run communication tests
        run: node tests/unit/communication.test.js
      - name: Run phase 4 tests
        run: node tests/unit/phase4.test.js
